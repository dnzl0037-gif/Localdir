function sha256(m){const K=[],H=[];for(let p=2,n=0;n<64;p++){let ok=1;for(let i=2;i*i<=p;i++)if(p%i===0)ok=0;if(ok){if(n<8)H[n]=(Math.pow(p,.5)%1)*4294967296|0;K[n++]=(Math.pow(p,1/3)%1)*4294967296|0}}
  const l=m.length,t=new Uint8Array(((l+9+63)>>6)<<6);t.set(m);t[l]=128;const dv=new DataView(t.buffer);dv.setUint32(t.length-4,l*8>>>0);dv.setUint32(t.length-8,Math.floor(l/536870912));
  const w=new Int32Array(64),h=H.slice(),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<t.length;o+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let[a,b,c,d,e,f,g,k]=h;
    for(let i=0;i<64;i++){const t1=(k+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;k=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    [a,b,c,d,e,f,g,k].forEach((v,i)=>h[i]=(h[i]+v)|0)}
  const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((v,i)=>ov.setInt32(i*4,v));return out}
async function hash(pw,salt,alg){
  const pb=new TextEncoder().encode(pw);
  if(alg==="p2"){
    if(!(window.crypto&&crypto.subtle))throw new Error("This browser cannot sign you in on a non-secure page. Open the site over https:// (for example your Netlify link).");
    const k=await crypto.subtle.importKey("raw",pb,"PBKDF2",false,["deriveBits"]);
    return b64(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256)));
  }
  let d=new Uint8Array([...salt,...pb]);for(let i=0;i<3000;i++)d=sha256(new Uint8Array([...d,...salt,...pb]));return b64(d);
}
const bestAlg=()=>(window.crypto&&crypto.subtle)?"p2":"s2";

/* ===== seeker views ===== */
const feat=s=>{const o=providers.find(x=>x.id===s.providerId);return typeof isPro==="function"&&isPro(o)};

const q={text:"",cat:""};
function cards(){
  const t=q.text.trim().toLowerCase();
  const l=live().filter(s=>(!q.cat||s.category===q.cat)&&(!t||(s.title+" "+s.description+" "+s.category+" "+s.city).toLowerCase().includes(t)));
  if(!live().length)return `<div class="empty"><h3>No services listed yet</h3><p>Services appear here once providers create an account and publish them. Are you a service provider?</p><a class="btn btn-p" href="#/provider">Create a provider account</a></div>`;
  if(!l.length)return `<div class="empty"><h3>No matches</h3><p>Try a different search or clear the category filter.</p></div>`;
  return `<div class="grid">${l.map(s=>`<a class="card" href="#/service/${esc(s.id)}"><span class="tag">${esc(s.category)}</span>${feat(s)?'<span class="tag" style="margin-left:6px;background:#f5d76e;color:#3b2f00">Featured</span>':""}<h3>${esc(s.title)}</h3><p class="d">${esc(s.description)}</p><span class="loc">${esc([s.city,s.address].filter(Boolean).join(" · "))}</span></a>`).join("")}</div>`;
}
function listUI(){
  const used=[...new Set(live().map(s=>s.category))];

let ptab="in",edit=null,pmsg=null;
const flash=(t,type="err")=>{pmsg={t,type}};
function msgHTML(){const m=pmsg;pmsg=null;return m?`<p class="msg ${m.type}" role="alert">${esc(m.t)}</p>`:""}
let pend=null;
const rnd6=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,"0");
const chash=(code,salt)=>b64(sha256(new TextEncoder().encode(code+salt)));
async function sendCode(){
  const E=CONFIG.EMAILJS;
  if(!E.SERVICE_ID||!E.TEMPLATE_ID||!E.PUBLIC_KEY)throw new Error("Email verification is not set up yet. The site owner must add the EmailJS keys in index.html (see README).");
  const code=rnd6(),salt=rid();
  const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:E.SERVICE_ID,template_id:E.TEMPLATE_ID,user_id:E.PUBLIC_KEY,template_params:{to_email:pend.email,to_name:pend.name,code,app_name:CONFIG.COMPANY}})});
  if(!r.ok)throw new Error("Could not send the verification email. "+(await r.text()).slice(0,140));
  Object.assign(pend,{salt,codeHash:chash(code,salt),exp:Date.now()+6e5,tries:0,sentAt:Date.now()});
}
async function begin(o){pend=o;try{await sendCode()}catch(e){pend=null;throw e}}
function verifyScreen(){
  $("#app").innerHTML=`<div class="page" style="max-width:32rem"><h1>Verify your email</h1><p style="color:var(--mut);margin-top:8px">We sent a 6-digit code to <b>${esc(pend.email)}</b>. Enter it below. The code expires in 10 minutes. Check your spam folder if you can't find it.</p>
  <form class="form" id="vf"><div><label for="vc">Verification code</label><input class="fi" id="vc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div>
  ${msgHTML()}<button class="btn btn-p">Verify and continue</button>
  <div class="acts"><button type="button" class="btn btn-o btn-s" id="rs">Send a new code</button><button type="button" class="btn btn-o btn-s" id="vx">Cancel</button></div></form></div>`;
  $("#vf").onsubmit=e=>{e.preventDefault();
    if(Date.now()>pend.exp){flash("This code has expired. Send a new code.");return provider()}
    if(++pend.tries>5){pend=null;flash("Too many wrong attempts. Please start again.");return provider()}
    if(chash($("#vc").value.trim(),pend.salt)!==pend.codeHash){flash("That code is not correct.");return provider()}
    const a=pend.acct;a.verified=true;if(pend.purpose==="up")providers.push(a);session=a.id;pend=null;save();edit=null;provider()};
  $("#rs").onclick=async()=>{if(Date.now()-pend.sentAt<30000){flash("Please wait 30 seconds before asking for another code.");return provider()}
    try{await sendCode();flash("A new code was sent.","ok")}catch(err){flash(err.message)}provider()};
  $("#vx").onclick=()=>{pend=null;provider()};
}
function googleIn(){
  const id=CONFIG.GOOGLE_CLIENT_ID;
  if(!id){flash("Google sign-in is not set up yet. The site owner must add the Google client ID in index.html (see README).");return provider()}
  if(!window.AndroidGoogle){flash("Google sign-in works in the Android app.");return provider()}
  window.onGoogleResult=async(tok,err)=>{
    if(!tok){flash(err||"Google sign-in was cancelled.");return provider()}
    try{
      const r=await fetch("https://oauth2.googleapis.com/tokeninfo?id_token="+encodeURIComponent(tok)),j=await r.json();
      if(!r.ok||j.aud!==id||String(j.email_verified)!=="true")throw 0;
      const email=j.email.toLowerCase();let x=providers.find(v=>v.email===email);
      if(!x){x={id:rid(),name:j.name||email.split("@")[0],email,google:true,verified:true};providers.push(x)}else x.verified=true;
      session=x.id;save();edit=null;provider();
    }catch{flash("Google could not verify this account. Please try again.");provider()}
  };
  AndroidGoogle.signIn(id);
}
const isPro=p=>p&&p.plan==="pro"&&(p.until||0)>Date.now();
function billingHTML(p){const pro=isPro(p);return `<div style="margin-top:32px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)"><h3>Billing</h3><p style="color:var(--mut);margin:6px 0 12px">Plan: <b>${pro?"Featured, active until "+new Date(p.until).toLocaleDateString():"Free"}</b></p>${pro?"":`<p style="margin-bottom:12px">Featured listing: your services appear first and carry a Featured badge. <b>${esc(CONFIG.BILLING.PRICE)}</b></p><button class="btn btn-p" id="up">Upgrade to Featured</button> `}<button class="btn btn-o btn-s" id="rf">Refresh payment status</button><p id="bm" class="msg" style="display:none;margin-top:10px"></p></div>`}
function bindBilling(p){
  const B=CONFIG.BILLING,m=t=>{const e=$("#bm");e.textContent=t;e.style.display="block"},need=()=>!B.API_URL&&(m("Online payments are not set up yet. The site owner must add the billing server address in index.html (see README)."),true);
  const u=$("#up");
  if(u)u.onclick=async()=>{if(need())return;u.disabled=true;try{const r=await fetch(B.API_URL+"/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({providerId:p.id,email:p.email,plan:"featured"})}),j=await r.json();if(!r.ok||!/^https:\/\//.test(j.url))throw 0;location.href=j.url}catch{m("Could not start checkout. Please try again.")}u.disabled=false};
  $("#rf").onclick=async()=>{if(need())return;try{const r=await fetch(B.API_URL+"/status?email="+encodeURIComponent(p.email)),j=await r.json();if(!r.ok)throw 0;p.plan=j.plan==="featured"?"pro":"free";p.until=+j.paidUntil||0;save();provider()}catch{m("Could not check payment status.")}}
}
function provider(){
  const p=me();
  if(!p&&pend){verifyScreen();return}
  if(!p){
    $("#app").innerHTML=`<div class="page" style="max-width:32rem"><h1>Service provider portal</h1><p style="color:var(--mut);margin-top:8px">Sign in to manage your services, or create a free provider account.</p>
    <div class="tabs"><button class="${ptab==="in"?"on":""}" data-t="in">Sign in</button><button class="${ptab==="up"?"on":""}" data-t="up">Create account</button></div>
    <form class="form" id="af">${ptab==="up"?`<div><label for="n">Business or contact name</label><input class="fi" id="n" required maxlength="80" autocomplete="organization"></div>`:""}
    <div><label for="e">Email</label><input class="fi" id="e" type="email" required autocomplete="email"></div>
    <div><label for="p">Password${ptab==="up"?" (at least 8 characters)":""}</label><input class="fi" id="p" type="password" required minlength="${ptab==="up"?8:1}" autocomplete="${ptab==="up"?"new-password":"current-password"}"></div>
    ${msgHTML()}<button class="btn btn-p">${ptab==="up"?"Create account":"Sign in"}</button></form>

    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ptab=b.dataset.t;provider()});
    $("#gg").onclick=googleIn;
    $("#af").onsubmit=async e=>{
      e.preventDefault();const email=$("#e").value.trim().toLowerCase(),pw=$("#p").value;
      try{
        if(ptab==="up"){
          if(providers.some(x=>x.email===email))return flash("An account with this email already exists."),provider();
          const salt=Uint8Array.from({length:16},()=>Math.random()*256|0);
          const alg=bestAlg(),np={id:rid(),name:$("#n").value.trim(),email,salt:b64(salt),alg,hash:await hash(pw,salt,alg),verified:false};
          await begin({purpose:"up",email,name:np.name,acct:np});
        }else{
          const x=providers.find(v=>v.email===email);
          if(x&&!x.hash)return flash("This account uses Google sign-in. Tap Continue with Google."),provider();
          if(!x||x.hash!==await hash(pw,Uint8Array.from(atob(x.salt),c=>c.charCodeAt(0)),x.alg||"p2"))return flash("Incorrect email or password."),provider();
          if(x.verified)session=x.id;else await begin({purpose:"in",email,name:x.name,acct:x});
        }

    };

  const mine=services.filter(s=>s.providerId===p.id);
  const form=edit!==null;const cur=edit&&edit!=="new"?services.find(s=>s.id===edit):{};
  $("#app").innerHTML=`<div class="page"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h1 style="margin:0">Your services</h1><p style="color:var(--mut)">Signed in as ${esc(p.name)} (${esc(p.email)}). Only you can see and edit these.</p></div><div class="acts"><button class="btn btn-p" id="add">Add a service</button><button class="btn btn-o" id="out">Sign out</button></div></div>
  ${msgHTML()}
  ${form?`<form class="form box" id="sf" style="background:var(--card)"><h3>${cur.id?"Edit service":"New service"}</h3>
  <div><label for="t">Service title</label><input class="fi" id="t" required maxlength="100" value="${esc(cur.title)}"></div>
  <div><label for="c">Category</label><select class="fi" id="c">${CATS.map(c=>`<option ${cur.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
  <div><label for="d">Description</label><textarea class="fi" id="d" rows="5" required minlength="20" maxlength="2000">${esc(cur.description)}</textarea></div>
  <div class="two"><div><label for="ph">Phone</label><input class="fi" id="ph" type="tel" required value="${esc(cur.phone)}"></div><div><label for="em">Contact email</label><input class="fi" id="em" type="email" value="${esc(cur.email||p.email)}"></div></div>
  <div class="two"><div><label for="ad">Address</label><input class="fi" id="ad" value="${esc(cur.address)}"></div><div><label for="ci">City / area</label><input class="fi" id="ci" required value="${esc(cur.city)}"></div></div>
  <div class="two"><div><label for="hr">Opening hours</label><input class="fi" id="hr" value="${esc(cur.hours)}"></div><div><label for="wb">Website</label><input class="fi" id="wb" placeholder="https://" value="${esc(cur.website)}"></div></div>

  <div class="acts"><button class="btn btn-p">Save service</button><button type="button" class="btn btn-o" id="cx">Cancel</button></div></form>`:""}
  ${mine.length?mine.map(s=>`<div class="row"><div><a href="#/service/${esc(s.id)}" style="font-weight:600">${esc(s.title)}</a><span class="pill ${s.published?"live":""}">${s.published?"Published":"Hidden"}</span><br><small>${esc(s.category)}</small></div>

  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const s=services.find(x=>x.id===b.dataset.p);s.published=!s.published;save();provider()});

/* ===== globe (WebGL, high resolution) ===== */
function globe(cv){
  const W=1440,H=720,m=globe.m||(globe.m=new Uint8Array(W*H)),fresh=!globe.d;globe.d=1;
  if(fresh)MASK.split("|").forEach((r,y)=>{let x=0,v=0;r.split(",").forEach(n=>{n=parseInt(n,36);if(v)m.fill(1,y*W+x,y*W+x+n);x+=n;v^=1})});
  const fallback=()=>{cv.style.background="radial-gradient(circle at 35% 30%,#58a6d6,#0b3b73 72%)";return()=>{}};
  const gl=cv.getContext("webgl",{premultipliedAlpha:true,antialias:false});
  if(!gl)return fallback();
  // smoothed land (3x3 box blur)
  const t1=new Uint8Array(W*H),land=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)t1[y*W+x]=m[y*W+(x+W-1)%W]+m[y*W+x]+m[y*W+(x+1)%W];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)land[y*W+x]=(t1[Math.max(0,y-1)*W+x]+t1[y*W+x]+t1[Math.min(H-1,y+1)*W+x])*255/9;
  // wide blur (coast distance) at 360x180
  const w2=360,h2=180;let a=new Float32Array(w2*h2);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)a[(y>>2)*w2+(x>>2)]+=m[y*W+x]/16;
  const box=(s,rad)=>{const t=new Float32Array(w2*h2),o=new Float32Array(w2*h2);
    for(let y=0;y<h2;y++)for(let x=0;x<w2;x++){let q=0;for(let k=-rad;k<=rad;k++)q+=s[y*w2+(x+k+w2)%w2];t[y*w2+x]=q/(2*rad+1)}
    for(let y=0;y<h2;y++)for(let x=0;x<w2;x++){let q=0;for(let k=-rad;k<=rad;k++)q+=t[Math.min(h2-1,Math.max(0,y+k))*w2+x];o[y*w2+x]=q/(2*rad+1)}return o};
  a=box(box(a,4),3);const wide=Uint8Array.from(a,v=>Math.min(255,v*255));

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== AI assistant ===== */
const chat=[];let busy=false;
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((#\/[^)\s]*|privacy\.html)\)/g,'<a href="$2">$1</a>').replace(/\n/g,"<br>");
function addMsg(role,text){const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");d.innerHTML=fmt(text);const b=$("#aim");b.appendChild(d);b.scrollTop=b.scrollHeight;return d}
function sysPrompt(){
  const l=live().slice(0,40).map(s=>`- ${s.title} (${s.category}, ${s.city}) → #/service/${s.id}`).join("\n")||"(no services have been published yet)";
  return `You are the helpful assistant on ${CONFIG.COMPANY}, a local services directory website. Help visitors find their way around. Be brief and friendly. Never invent services or providers; only mention ones from the list below.
Site map: Home #/ ; browse and search all services #/services ; a service page #/service/ID (shows the description and provider details); service provider sign in / create account / manage their own services #/provider ; privacy policy privacy.html.
How it works: People looking for a service can browse and search without an account, open a listing, and contact the provider directly by phone, email or address. Service providers create a provider account on #/provider, then add services (title, category, description, contact details) and can publish, hide, edit or delete them. Providers can only see and manage their own listings. Categories: ${CATS.join(", ")}.
When you point to a page, write it as a markdown link like [browse services](#/services).
Currently published services:\n${l}`;
}
async function aiCall(model){
  return fetch(CONFIG.AI_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+CONFIG.AI_KEY},
    body:JSON.stringify({model,messages:[{role:"system",content:sysPrompt()},...chat.slice(-12)],max_tokens:800,temperature:.4})});
}
async function ask(text){
  if(busy)return;busy=true;addMsg("user",text);chat.push({role:"user",content:text});
  const wait=addMsg("a","…");
  try{
    let r=await aiCall(CONFIG.AI_MODEL);
    if(r.status===400||r.status===404){ // model id may have changed: pick a DeepSeek model from the provider's list
      try{const ml=await fetch(CONFIG.AI_MODELS_URL,{headers:{Authorization:"Bearer "+CONFIG.AI_KEY}}).then(x=>x.json());
        const ids=(ml.data||[]).map(m=>m.id),pick=ids.find(i=>/deepseek/i.test(i))||ids[0];
        if(pick&&pick!==CONFIG.AI_MODEL){CONFIG.AI_MODEL=pick;r=await aiCall(pick)}}catch(_){}
    }
    if(r.status===401||r.status===403)throw new Error("the API key was rejected");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json(),a=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"").trim()||"Sorry, I didn't get a reply. Please try again.";
    chat.push({role:"assistant",content:a});wait.innerHTML=fmt(a);
  }catch(e){wait.innerHTML=fmt("Sorry, the assistant is unavailable right now ("+(e.message||"network error")+"). You can still [browse services](#/services) or open the [provider portal](#/provider).");chat.pop()}
  busy=false;$("#aim").scrollTop=1e9;
}
function openAI(){
  $("#ai").classList.add("open");$("#ai-btn").style.display="none";
  if(!$("#aim").children.length){addMsg("a","Hi! I can help you find a service or explain how the site works. What do you need?");
    const s=document.createElement("div");s.className="sug";["How do I find a service?","I'm a provider, how do I list my service?"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{s.remove();ask(t)};s.appendChild(b)});$("#aim").appendChild(s)}
  $("#aiq").focus();
}
$("#ai-btn").onclick=openAI;$("#aix").onclick=()=>{$("#ai").classList.remove("open");$("#ai-btn").style.display=""};
$("#aif").onsubmit=e=>{e.preventDefault();const v=$("#aiq").value.trim();if(v){$("#aiq").value="";ask(v)}};
document.addEventListener("click",e=>{const a=e.target.closest(".m a");if(a&&a.getAttribute("href").startsWith("#"))$("#ai").classList.contains("open")&&0});
route();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

 b.onclick=()=>{const d=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=d?"dark":"light";try{localStorage.setItem("ld.theme",d?"dark":"light")}catch{}paint()};paint()})();
